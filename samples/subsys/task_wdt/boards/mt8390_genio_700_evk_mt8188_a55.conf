# The hardware fallback's timeout is this plus TASK_WDT_HW_FALLBACK_DELAY, and
# the watchdog's shortest timeout is 2 s.
CONFIG_TASK_WDT_MIN_TIMEOUT=2000

# The watchdog does not pause under a debugger, and task_wdt ignores the error
# wdt_setup() returns for an option it cannot honour: the fallback would never
# start.
CONFIG_TASK_WDT_HW_FALLBACK_PAUSE_HALTED_BY_DBG=n
