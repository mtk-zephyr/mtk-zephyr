# Enables the MediaTek MT8188 watchdog.
name: mtk-wdt

boards:
  # Both Genio EVKs include mt8188.dtsi, which defines the watchdog node.
  /.*mt(8390_genio_700|8370_genio_510)_evk.*/:
    append:
      EXTRA_CONF_FILE: mtk-wdt.conf
      EXTRA_DTC_OVERLAY_FILE: mtk-wdt.overlay
