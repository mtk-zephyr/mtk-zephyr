name: mtk-afe
description: Enables the MediaTek Audio Front End and the buffer region it uses.

boards:
  # Both Genio EVKs: same die, same AFE, same audio serial pins.
  /.*mt(8390_genio_700|8370_genio_510)_evk.*/:
    append:
      EXTRA_CONF_FILE: mtk-afe.conf
      EXTRA_DTC_OVERLAY_FILE: mtk-afe.overlay
