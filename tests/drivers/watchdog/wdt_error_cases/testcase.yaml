common:
  tags:
    - drivers
    - watchdog
  depends_on: watchdog
  harness: ztest

tests:
  drivers.watchdog.wdt_error_cases:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpunet
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54h20dk/nrf54h20/cpurad
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9280pdk/nrf9280/cpuapp
      - nrf9280pdk/nrf9280/cpurad
      - ophelia4ev/nrf54l15/cpuapp
      - xg24_rb4187c
      - xg27_dk2602a
      - raytac_an54lq_db_15/nrf54l15/cpuapp
      - sam_e54_xpro
      - pic32cx_sg41_cult
      - mt8370_genio_510_evk/mt8188/a55
      - mt8390_genio_700_evk/mt8188/a55
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - ophelia4ev/nrf54l15/cpuapp
      - raytac_an54lq_db_15/nrf54l15/cpuapp
  drivers.watchdog.wdt_error_cases_pm:
    platform_allow:
      - xg24_rb4187c
      - xg27_dk2602a
    extra_configs:
      - CONFIG_PM=y
